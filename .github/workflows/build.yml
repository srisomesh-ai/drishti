name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Download object detection model (EfficientDet-Lite0, COCO 80 objects)
        run: |
          curl -fL -o app/src/main/assets/efficientdet.tflite \
            https://storage.googleapis.com/download.tensorflow.org/models/tflite/task_library/object_detection/android/lite-model_efficientdet_lite0_detection_metadata_1.tflite
          ls -la app/src/main/assets

      - name: Build
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Drishti-test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Drishti-apk
          path: Drishti-test.apk

      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest Drishti-test.apk -t "Drishti test build" -n "Built from ${GITHUB_SHA::7}"

      - name: Push APK to apk branch
        run: |
          mkdir /tmp/apk && cp Drishti-test.apk /tmp/apk/ && cd /tmp/apk
          git init -q -b apk
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add Drishti-test.apk && git commit -q -m "APK ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}" apk
